# Kept below 4 GB: this machine runs builds next to a browser-heavy desktop.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP still registers generated sources via kotlin.sourceSets, which AGP 9 built-in Kotlin
# rejects by default. Revisit when KSP is fully AGP 9 native.
android.disallowKotlinSourceSets=false
